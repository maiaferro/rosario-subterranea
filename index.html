<style>
/* Layout: mapa a la izquierda, panel del lugar a la derecha (foto 360, video, texto); en celular se apila. */
:root {
  --bg: #e8ebed;
  --surface: #f6f7f8;
  --surface-2: #dfe4e7;
  --line: #c3cbd1;
  --fg: #12181d;
  --muted: #55626c;
  --accent: #0d7766;
  --accent-ink: #f2fbf9;
  --map-bg: #d5dbdf;
  --grid: rgba(18, 24, 29, .08);
  --river: #b9cdd8;
  --tile-filter: none;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1216;
    --surface: #151b21;
    --surface-2: #1c242c;
    --line: #26313b;
    --fg: #e6e2d8;
    --muted: #8c98a3;
    --accent: #6cc4b0;
    --accent-ink: #0b1d19;
    --map-bg: #141a20;
    --grid: rgba(230, 226, 216, .05);
    --river: #16232d;
    --tile-filter: invert(1) hue-rotate(190deg) brightness(.8) contrast(.92) saturate(.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1216;
  --surface: #151b21;
  --surface-2: #1c242c;
  --line: #26313b;
  --fg: #e6e2d8;
  --muted: #8c98a3;
  --accent: #6cc4b0;
  --accent-ink: #0b1d19;
  --map-bg: #141a20;
  --grid: rgba(230, 226, 216, .05);
  --river: #16232d;
  --tile-filter: invert(1) hue-rotate(190deg) brightness(.8) contrast(.92) saturate(.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 17px/1.55 var(--body);
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 100%;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Cabecera */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; min-width: 0; }
.top h1 {
  margin: 0;
  font: 900 clamp(34px, 6vw, 54px)/.92 var(--display);
  letter-spacing: .01em;
  text-transform: uppercase;
  text-wrap: balance;
}
.top p { margin: 0; font: 500 12px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Escenario */
.stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.mapcol { position: relative; min-width: 0; }
#map {
  height: clamp(300px, 52vh, 480px);
  width: 100%;
  border: 1px solid var(--line);
  background-color: var(--map-bg);
}
#map.notiles {
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 44px 44px;
}
.leaflet-container { font: 400 13px/1.4 var(--mono); background-color: var(--map-bg); }
.leaflet-tile-pane { filter: var(--tile-filter); }
path.river { fill: var(--river); fill-opacity: 1; stroke: none; }
.rivlabel { font: 500 11px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); white-space: nowrap; background: none; border: 0; }
.leaflet-bar a, .leaflet-bar a:hover { background: var(--surface); color: var(--fg); border-color: var(--line); }
.leaflet-bar { border: 1px solid var(--line); box-shadow: none; }
.leaflet-control-attribution { background: var(--surface) !important; color: var(--muted) !important; font: 400 10px/1.4 var(--mono); }
.leaflet-control-attribution a { color: var(--muted) !important; }
.leaflet-tooltip { background: var(--surface); color: var(--fg); border: 1px solid var(--line); box-shadow: none; font: 500 12px/1.3 var(--mono); border-radius: 0; }
.leaflet-tooltip-top:before { border-top-color: var(--line); }
.pinwrap { background: none; border: 0; }
.pin {
  width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--bg); color: var(--accent);
  border: 2px solid var(--accent);
  font: 500 12px/1 var(--mono);
  cursor: pointer;
  transition: transform .15s, background .15s, color .15s;
}
.pin.on { background: var(--accent); color: var(--accent-ink); transform: scale(1.25); }
.pinwrap.adjusting .pin { border-style: dashed; cursor: grab; }

.adjust { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.adjust textarea {
  width: 100%; min-height: 150px; resize: vertical;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line);
  font: 400 12px/1.5 var(--mono); padding: 10px;
}
.adjust p { margin: 0; font: 400 12px/1.5 var(--mono); color: var(--muted); }
.linkbtn {
  align-self: flex-start;
  background: none; border: 1px solid var(--line); color: var(--muted);
  font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  padding: 8px 10px; cursor: pointer;
}
.linkbtn:hover, .linkbtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

/* Índice de lugares */
.index { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.index button {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line);
  padding: 8px 12px; min-width: 0;
}
.index .n { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .06em; }
.index .t { font: 800 17px/1.1 var(--display); letter-spacing: .03em; text-transform: uppercase; }
.index button:hover { border-color: var(--accent); }
.index button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.index button[aria-current="true"] .n { color: var(--accent-ink); }

/* Panel del lugar */
.panel { background: var(--surface); border: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; }
.panel .head { padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 8px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 12px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.eyebrow b { color: var(--accent); font-weight: 500; }
.panel h2 { margin: 0; font: 900 clamp(32px, 4.6vw, 48px)/.95 var(--display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.addr { font: 400 13px/1.4 var(--mono); color: var(--muted); }
.tag { align-self: flex-start; font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line); padding: 5px 8px; }

.media { display: flex; flex-direction: column; gap: 1px; background: var(--line); border-block: 1px solid var(--line); }
.pano, .vid { width: 100%; aspect-ratio: 16 / 10; max-width: 100%; background: #0b0f13; position: relative; }
.vid { aspect-ratio: 16 / 9; }
.vid video, .vid iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
.vid.empty { display: grid; place-items: center; text-align: center; padding: 16px; color: #9aa6b0; background: repeating-linear-gradient(135deg, #0f1418 0 12px, #12181d 12px 24px); font: 400 12px/1.5 var(--mono); }
.label { position: absolute; left: 10px; bottom: 10px; z-index: 5; pointer-events: none; font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #e6e2d8; background: rgba(11, 15, 19, .75); padding: 6px 8px; }
.pano .pnlm-container { background: #0b0f13; }

.copy { padding: 18px; display: flex; flex-direction: column; gap: 14px; max-width: 68ch; }
.copy p { margin: 0; }
.copy p.todo { color: var(--muted); font-style: italic; }
.nav { display: flex; gap: 8px; padding: 0 18px 18px; margin-top: auto; }
.nav button {
  flex: 1; min-width: 0; cursor: pointer;
  background: none; border: 1px solid var(--line);
  font: 500 12px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  padding: 12px; text-align: left;
}
.nav button:hover { border-color: var(--accent); color: var(--accent); }
.nav button[disabled] { opacity: .35; cursor: default; border-color: var(--line); color: inherit; }
.nav .next { text-align: right; }

@media (min-width: 900px) {
  body { height: 100%; }
  .stage {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(380px, .9fr);
    grid-template-rows: minmax(0, 1fr) auto;
    gap: 12px;
  }
  .mapcol { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; min-height: 0; }
  #map { flex: 1; height: auto; min-height: 320px; }
  .index { grid-column: 1; grid-row: 2; }
  .panel { grid-column: 2; grid-row: 1 / span 2; overflow-y: auto; min-height: 0; }
}
@media (prefers-reduced-motion: reduce) { .pin { transition: none; } }
</style>

<header class="top">
  <h1>Rosario Subterránea</h1>
  <p>Documental interactivo · <span id="count">8</span> lugares bajo la ciudad</p>
</header>

<main class="stage">
  <section class="mapcol" aria-label="Mapa de lugares">
    <div id="map"></div>
    <div class="adjust" id="adjust" hidden>
      <p>Arrastrá cada punto hasta su lugar exacto. Después copiá este texto y pegalo en los datos de la web (lat y lng de cada lugar).</p>
      <textarea id="adjOut" readonly aria-label="Coordenadas ajustadas"></textarea>
    </div>
  </section>

  <ol class="index" id="index" aria-label="Lugares"></ol>

  <article class="panel" id="panel" aria-live="polite">
    <div class="head">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 id="title"></h2>
      <div class="addr" id="addr"></div>
      <div class="tag" id="aprox" hidden>Ubicación aproximada en el mapa</div>
    </div>
    <div class="media">
      <div class="pano" id="panoWrap"><span class="label">360° · arrastrá para mirar</span><div id="pano" style="width:100%;height:100%"></div></div>
      <div id="vidWrap"></div>
    </div>
    <div class="copy" id="copy"></div>
    <div class="nav">
      <button type="button" class="prev" id="prev"></button>
      <button type="button" class="next" id="next"></button>
    </div>
  </article>
</main>

<button type="button" class="linkbtn" id="adjBtn" aria-pressed="false">Ajustar ubicaciones</button>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
/* ============================================================
   DATOS DEL DOCUMENTAL — editá solo esta parte
   foto360: ruta a una imagen equirectangular (2:1), por ejemplo "media/pasaje-pan-360.jpg"
   video:   ruta a un .mp4 ("media/pasaje-pan.mp4") o un link de YouTube
   Si dejás foto360 o video en null se muestra un ejemplo.
   aprox: true marca que el punto en el mapa todavía no fue verificado.
   ============================================================ */
const PLACES = [
  { id: "pasaje-pan", corto: "Pasaje Pan", nombre: "Pasaje Pan / Galería del Pasaje", direccion: "Córdoba 954",
    lat: -32.9468, lng: -60.6357, aprox: true, foto360: prueba.png, video: https://www.youtube.com/watch?v=2P1wZD5R6cA,
    texto: [
      "El Pasaje Pan o también llamado Pam es el nombre de una pequeña y antigua",
      "galería de la ciudad de Rosario, Provincia de Santa Fe, Argentina. Fue inaugurado"
    ] },
  { id: "plataforma-lavarden", corto: "Plataforma Lavardén", nombre: "Plataforma Lavardén", direccion: "Mendoza 1085",
    lat: -32.9500, lng: -60.6371, aprox: true, foto360: null, video: null,
    texto: [
      "Edificio del Centro Cultural Provincial Lavardén, en Mendoza y Sarmiento. Antes alojó el hotel de la Federación Agraria Argentina.",
      "Plataforma Lavardén se inauguró en 2012 y reúne unos cincuenta espacios para actividades culturales. Según fuentes públicas, el edificio tiene seis pisos y dos niveles subterráneos."
    ] },
  { id: "museo-estevez", corto: "Museo Estévez", nombre: "Museo de Arte Decorativo Firma y Odilo Estévez", direccion: "Santa Fe 748",
    lat: -32.9462, lng: -60.6339, aprox: true, foto360: null, video: null,
    texto: [
      "Inaugurado el 8 de julio de 1968 frente a la Plaza 25 de Mayo, guarda una colección de antigüedades donadas por familias de Rosario.",
      "Completar: qué se recorre en el subsuelo."
    ], pendiente: true },
  { id: "teatro-el-circulo", corto: "Teatro El Círculo", nombre: "Teatro El Círculo", direccion: "Laprida 1223",
    lat: -32.9509, lng: -60.6386, aprox: true, foto360: null, video: null,
    texto: ["Texto por escribir."], pendiente: true },
  { id: "san-lorenzo-1055", corto: "San Lorenzo 1055", nombre: "San Lorenzo 1055", direccion: "San Lorenzo 1055",
    lat: -32.9455, lng: -60.6367, aprox: true, foto360: null, video: null,
    texto: ["Texto por escribir."], pendiente: true },
  { id: "monumento", corto: "El Monumento", nombre: "El Monumento", direccion: "Monumento Nacional a la Bandera",
    lat: -32.9476, lng: -60.6298, aprox: true, foto360: null, video: null,
    texto: ["Texto por escribir."], pendiente: true },
  { id: "la-vigil", corto: "La Vigil", nombre: "La Vigil", direccion: "Alem 3078 · Gaboto 450",
    lat: -32.9736, lng: -60.6575, aprox: true, foto360: null, video: null,
    texto: [
      "La Biblioteca Popular Constancio C. Vigil se creó en 1959 desde la asociación vecinal del barrio Tablada y Villa Manuelita.",
      "Su proyecto fue atacado durante la última dictadura y hoy es Sitio de Memoria del Terrorismo de Estado. El recorrido guiado pasa por la biblioteca, el archivo, el observatorio, el teatro y los subsuelos."
    ] },
  { id: "ex-jefatura", corto: "Ex Jefatura", nombre: "Ex Jefatura de Policía", direccion: "Dorrego y San Lorenzo · Santa Fe 1950",
    lat: -32.9458, lng: -60.6465, aprox: true, foto360: null, video: null,
    texto: [
      "Entre 1976 y 1979 funcionó en este edificio el Servicio de Informaciones de la policía provincial, uno de los centros clandestinos de detención de Rosario. Hoy es Espacio de Memoria.",
      "Se preservaron el ex Servicio de Informaciones y el subsuelo de la ex Alcaidía de Mujeres. Existen además relatos sobre túneles que lo conectarían con el antiguo Comando del 2.º Cuerpo de Ejército, que investigadores estudian como parte de la memoria local."
    ] }
];
/* ============== fin de los datos ============== */

function start() {
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cur = -1, viewer = null, markers = [], adjusting = false;
  var pad = function (n) { return n < 10 ? "0" + n : "" + n; };

  $("count").textContent = PLACES.length;

  /* Mapa */
  var map = L.map("map", { zoomControl: true, scrollWheelZoom: true });
  var tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a>"
  }).addTo(map);
  var loaded = 0, failed = 0, fell = false;
  tiles.on("tileload", function () { loaded++; });
  tiles.on("tileerror", function () {
    failed++;
    if (!loaded && failed >= 3 && !fell) {
      fell = true;
      $("map").classList.add("notiles");
      var shore = [[-32.90, -60.6129], [-32.9230, -60.6205], [-32.9476, -60.6286], [-32.9700, -60.6360], [-32.9970, -60.6450], [-33.02, -60.6526]];
      var poly = shore.concat([[-33.02, -60.52], [-32.90, -60.52]]);
      L.polygon(poly, { className: "river", interactive: false }).addTo(map);
      L.marker([-32.9476, -60.6195], { interactive: false, icon: L.divIcon({ className: "rivlabel", html: "Río Paraná", iconSize: [100, 12] }) }).addTo(map);
    }
  });

  map.fitBounds(L.latLngBounds(PLACES.map(function (p) { return [p.lat, p.lng]; })), { padding: [40, 40] });

  PLACES.forEach(function (p, i) {
    var icon = L.divIcon({ className: "pinwrap", html: "<div class=\"pin\">" + pad(i + 1) + "</div>", iconSize: [30, 30], iconAnchor: [15, 15] });
    var m = L.marker([p.lat, p.lng], { icon: icon, draggable: true, keyboard: true, title: p.nombre }).addTo(map);
    m.dragging.disable();
    m.bindTooltip(p.corto, { direction: "top", offset: [0, -18] });
    m.on("click", function () { if (!adjusting) show(i); });
    m.on("dragend", function () { var ll = m.getLatLng(); p.lat = +ll.lat.toFixed(5); p.lng = +ll.lng.toFixed(5); dump(); });
    markers.push(m);
  });

  /* Índice */
  var index = $("index");
  PLACES.forEach(function (p, i) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.innerHTML = "<span class=\"n\">" + pad(i + 1) + "</span><span class=\"t\"></span>";
    b.querySelector(".t").textContent = p.corto;
    b.addEventListener("click", function () { show(i); });
    li.appendChild(b);
    index.appendChild(li);
  });

  /* 360 */
  var DEFAULT360 = window.DEFAULT_360;
  function mountPano(src) {
    if (viewer) { try { viewer.destroy(); } catch (e) {} viewer = null; }
    var host = $("pano");
    host.innerHTML = "";
    if (typeof pannellum === "undefined") { host.innerHTML = "<div class=\"vid empty\" style=\"height:100%\">No se pudo cargar el visor 360.</div>"; return; }
    try {
      viewer = pannellum.viewer("pano", {
        type: "equirectangular", panorama: src || DEFAULT360,
        autoLoad: true, showControls: true, compass: false, hfov: 105, minHfov: 50, maxHfov: 120,
        autoRotate: reduce ? 0 : -2, autoRotateInactivityDelay: 4000
      });
    } catch (e) { host.textContent = "No se pudo abrir la foto 360."; }
  }

  /* Video */
  function mountVideo(src, name) {
    var w = $("vidWrap");
    w.innerHTML = "";
    var box = document.createElement("div");
    if (!src) {
      box.className = "vid empty";
      box.innerHTML = "<div>Video pendiente<br>Agregá el archivo en el campo <b>video</b> de este lugar</div>";
    } else {
      box.className = "vid";
      var yt = src.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
      if (yt) {
        var f = document.createElement("iframe");
        f.src = "https://www.youtube-nocookie.com/embed/" + yt[1];
        f.title = "Video: " + name; f.allowFullscreen = true; f.loading = "lazy";
        f.setAttribute("allow", "accelerometer; encrypted-media; picture-in-picture; fullscreen");
        box.appendChild(f);
      } else {
        var v = document.createElement("video");
        v.controls = true; v.preload = "metadata"; v.playsInline = true; v.src = src;
        box.appendChild(v);
      }
    }
    w.appendChild(box);
  }

  /* Panel */
  function show(i) {
    if (i < 0 || i >= PLACES.length) return;
    var p = PLACES[i];
    cur = i;
    $("eyebrow").innerHTML = "<b>Lugar " + pad(i + 1) + " de " + pad(PLACES.length) + "</b>";
    $("title").textContent = p.nombre;
    $("addr").textContent = p.direccion + " · Rosario";
    $("aprox").hidden = !p.aprox;
    var c = $("copy");
    c.innerHTML = "";
    p.texto.forEach(function (t) {
      var el = document.createElement("p");
      if (p.pendiente && /^(Texto por escribir|Completar)/.test(t)) el.className = "todo";
      el.textContent = t;
      c.appendChild(el);
    });
    mountPano(p.foto360);
    mountVideo(p.video, p.nombre);
    var prev = $("prev"), next = $("next");
    prev.disabled = i === 0; next.disabled = i === PLACES.length - 1;
    prev.textContent = i > 0 ? "← " + PLACES[i - 1].corto : "←";
    next.textContent = i < PLACES.length - 1 ? PLACES[i + 1].corto + " →" : "→";
    Array.prototype.forEach.call(index.querySelectorAll("button"), function (b, k) {
      if (k === i) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    });
    markers.forEach(function (m, k) {
      var pin = m.getElement() && m.getElement().querySelector(".pin");
      if (pin) pin.classList.toggle("on", k === i);
    });
    var z = Math.max(map.getZoom(), 16);
    map.flyTo([p.lat, p.lng], z, { animate: !reduce, duration: .8 });
    $("panel").scrollTop = 0;
  }
  $("prev").addEventListener("click", function () { show(cur - 1); });
  $("next").addEventListener("click", function () { show(cur + 1); });

  /* Ajuste de ubicaciones */
  function dump() {
    $("adjOut").value = PLACES.map(function (p) {
      return p.id + ": lat " + p.lat + ", lng " + p.lng;
    }).join("\n");
  }
  $("adjBtn").addEventListener("click", function () {
    adjusting = !adjusting;
    this.setAttribute("aria-pressed", adjusting ? "true" : "false");
    this.textContent = adjusting ? "Terminar ajuste" : "Ajustar ubicaciones";
    $("adjust").hidden = !adjusting;
    markers.forEach(function (m) {
      if (adjusting) m.dragging.enable(); else m.dragging.disable();
      var el = m.getElement();
      if (el) el.classList.toggle("adjusting", adjusting);
    });
    if (adjusting) dump();
  });

  /* Primer lugar, o el que venga en la dirección (#la-vigil) */
  var h = (location.hash || "").replace("#", "");
  var first = 0;
  PLACES.forEach(function (p, i) { if (p.id === h) first = i; });
  map.whenReady(function () { show(first); });
}
</script>
